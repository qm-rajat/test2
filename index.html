<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e9">
  <title>Demo Websites</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

    :root {
      color-scheme: light;
      --paper: #f4f1e9;
      --ink: #20231f;
      --muted: #73756d;
      --line: #d8d7ce;
      --accent: #ce4a2d;
      --panel: #fffefa;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Manrope', sans-serif;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 82px;
      padding: 14px 28px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .identity { display: flex; align-items: center; gap: 14px; min-width: 190px; }
    .mark {
      display: grid;
      width: 38px;
      aspect-ratio: 1;
      place-items: center;
      color: white;
      background: var(--accent);
      font-size: 17px;
      font-weight: 800;
    }
    .identity strong { display: block; font-size: 14px; font-weight: 800; }
    .identity span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .switcher { display: flex; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
    .switcher button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      background: transparent;
      font: 600 12px 'Manrope', sans-serif;
      cursor: pointer;
      transition: background .18s ease, color .18s ease, border-color .18s ease;
    }
    .switcher button:hover { border-color: var(--ink); }
    .switcher button[aria-pressed="true"] { border-color: var(--ink); color: white; background: var(--ink); }
    .workspace { position: relative; min-height: 0; background: #e5e3dc; }
    .preview { display: block; width: 100%; height: 100%; border: 0; background: white; }
    .open-link {
      position: absolute;
      right: 18px;
      bottom: 18px;
      display: grid;
      width: 42px;
      aspect-ratio: 1;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 3px;
      color: var(--ink);
      background: var(--panel);
      text-decoration: none;
      box-shadow: 0 2px 10px #20231f1a;
    }
    .open-link:hover { color: white; border-color: var(--accent); background: var(--accent); }
    .open-link svg { width: 17px; height: 17px; }

    @media (max-width: 760px) {
      body { grid-template-rows: auto minmax(0, 1fr); }
      .topbar { align-items: flex-start; flex-direction: column; gap: 13px; padding: 13px 16px; }
      .identity { min-width: auto; }
      .switcher { justify-content: flex-start; width: 100%; flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
      .switcher button { flex: 0 0 auto; }
      .open-link { right: 10px; bottom: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="identity">
      <div class="mark" aria-hidden="true">D</div>
      <div><strong>Website demos</strong><span id="active-name">Voltline Electricals</span></div>
    </div>
    <nav class="switcher" aria-label="Choose a demo website">
      <button type="button" data-name="Voltline Electricals" data-src="demo-websites/01-voltline-electricals/index.html" aria-pressed="true">01 Voltline</button>
      <button type="button" data-name="Veda Leaf Skincare" data-src="demo-websites/02-vedaleaf-skincare/index.html" aria-pressed="false">02 Veda Leaf</button>
      <button type="button" data-name="Suryam Solar Parts" data-src="demo-websites/03-suryam-solar-parts/index.html" aria-pressed="false">03 Suryam Solar</button>
      <button type="button" data-name="Fixwell Tools" data-src="demo-websites/04-fixwell-tools/index.html" aria-pressed="false">04 Fixwell</button>
      <button type="button" data-name="Kora Living" data-src="demo-websites/05-kora-living/index.html" aria-pressed="false">05 Kora Living</button>
    </nav>
  </header>
  <main class="workspace">
    <iframe class="preview" id="preview" title="Voltline Electricals website demo" src="demo-websites/01-voltline-electricals/index.html"></iframe>
    <a class="open-link" id="open-link" href="demo-websites/01-voltline-electricals/index.html" target="_blank" rel="noopener" aria-label="Open this demo in a new tab" title="Open demo in a new tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/></svg>
    </a>
  </main>
  <script>
    const preview = document.querySelector('#preview');
    const activeName = document.querySelector('#active-name');
    const openLink = document.querySelector('#open-link');
    const buttons = [...document.querySelectorAll('.switcher button')];

    function selectDemo(button) {
      const { name, src } = button.dataset;
      preview.src = src;
      preview.title = `${name} website demo`;
      activeName.textContent = name;
      openLink.href = src;
      buttons.forEach((item) => item.setAttribute('aria-pressed', String(item === button)));
      history.replaceState(null, '', `#${src.split('/')[1]}`);
    }

    buttons.forEach((button) => button.addEventListener('click', () => selectDemo(button)));

    const initialFolder = location.hash.slice(1);
    const initialButton = buttons.find((button) => button.dataset.src.split('/')[1] === initialFolder);
    if (initialButton) selectDemo(initialButton);
  </script>
</body>
</html>
